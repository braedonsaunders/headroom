# Release: on a version tag, build every platform from the tagged source and attach the macOS DMG and the
# Windows portable ZIP (plus SHA256SUMS) to a draft GitHub Release for review before publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      notarize: true
    secrets: inherit

  collect:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Select release assets and checksums
        run: |
          mkdir release
          cp dist/*-macOS-universal.dmg release/
          cp dist/*-win64.zip release/
          cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Headroom-release-${{ github.ref_name }}
          path: release/*
      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" release/* --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" release/* --draft --title "Headroom ${GITHUB_REF_NAME#v}" \
                 --notes "Release notes to follow." --repo "$GITHUB_REPOSITORY"
