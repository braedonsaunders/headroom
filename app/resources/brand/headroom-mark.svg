<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="hr-anim" viewBox="0 0 120 120" style="--bg:#1f2025;--bg2:#18191d;--ink:#ececef;--ink3:#5d6068;--acc:#e3a04b;--acc2:#f6c27a;--hot:#ff7b2e;--halo:.16" width="120" height="120"><style>
.f-ink{fill:var(--ink)}.f-ink3{fill:var(--ink3)}.f-acc{fill:var(--acc)}.f-none{fill:none}
.s-ink{stroke:var(--ink)}.sc-bg{stop-color:var(--bg)}.sc-bg2{stop-color:var(--bg2)}.sc-acc{stop-color:var(--acc)}.sc-acc2{stop-color:var(--acc2)}.sc-hot{stop-color:var(--hot)}
.hr-halo{opacity:var(--halo)}
@keyframes gl-sil{0%{opacity:0}22%{opacity:.2}46%{opacity:.26}100%{opacity:1}}
@keyframes gl-sil2{0%{opacity:0}30%{opacity:.16}52%{opacity:.24}100%{opacity:1}}
@keyframes gl-in{from{opacity:0}}
@keyframes gl-draw{from{stroke-dashoffset:1}}
@keyframes gl-heat{0%{stroke:#2e0b05}22%{stroke:#6a1907}46%{stroke:#b23a0c}68%{stroke:#f07a24}84%{stroke:#ffe6bd}100%{stroke:#ffd49a}}
@keyframes gl-bloom{0%{opacity:0}35%{opacity:.12}82%{opacity:1}100%{opacity:.86}}
@keyframes gl-breathe{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes gl-flick{0%,58%{opacity:1}59%{opacity:.82}60%{opacity:1}61.5%{opacity:.9}62.5%,100%{opacity:1}}
@keyframes gl-glint{from{opacity:1;transform:translateX(-34px)}to{opacity:1;transform:translateX(66px)}}
@keyframes gl-rise{from{opacity:0;transform:translateY(10px)}}
@keyframes gl-ink{from{fill-opacity:0}}
@keyframes gl-word-glow{0%{opacity:0}42%{opacity:1}100%{opacity:.4}}
.gl-sil{animation:gl-sil 2.4s cubic-bezier(.45,0,.25,1) .05s backwards}
.gl-sil2{animation:gl-sil2 2.5s cubic-bezier(.45,0,.25,1) .25s backwards}
.gl-plate{animation:gl-sil 2s cubic-bezier(.45,0,.25,1) .35s backwards}
.gl-coil{stroke:#ffd49a;stroke-dasharray:1;animation:gl-draw .8s cubic-bezier(.3,0,.2,1) .5s backwards,gl-heat 1.75s cubic-bezier(.5,0,.75,1) .5s backwards}
.gl-b1{opacity:.86;animation:gl-bloom 1.9s cubic-bezier(.45,0,.3,1) .75s backwards}
.gl-b2{opacity:.86;animation:gl-bloom 2.2s cubic-bezier(.45,0,.3,1) .95s backwards}
.gl-lit{animation:gl-in 1.6s ease-out 1.15s backwards}
.gl-amb{animation:gl-in 1.9s ease-out 1.05s backwards}
.gl-halo{animation:gl-in 2.6s ease-out 1.2s backwards}
.gl-br{animation:gl-breathe 6.5s ease-in-out 3.3s infinite}
.gl-fl{animation:gl-flick 9s linear 4.2s infinite}
.gl-glint{opacity:0;animation:gl-glint 1.25s cubic-bezier(.45,0,.3,1) 2.45s}
.gl-word{animation:gl-rise 1s cubic-bezier(.2,.7,.2,1) var(--w,1.7s) backwards}
.gl-t1{animation:gl-ink .9s ease-out var(--w,1.7s) backwards}
.gl-t2{animation:gl-ink 1.1s ease-out calc(var(--w,1.7s) + .22s) backwards}
.gl-wglow{opacity:.4;animation:gl-word-glow 1.8s ease-out calc(var(--w,1.7s) + .3s) backwards}
.gl-tag{animation:gl-rise 1s cubic-bezier(.2,.7,.2,1) calc(var(--w,1.7s) + .5s) backwards}
@keyframes gl-sweep{from{transform:translateX(-60px)}to{transform:translateX(180px)}}
.hr-loader{animation:gl-in .8s ease-out 2.7s backwards}
.hr-ind{animation:gl-sweep 1.6s cubic-bezier(.45,0,.55,1) 2.7s infinite}
.hr-fill{transform:scaleX(0)}
.hr-driven .hr-ind{display:none}
.hr-driven .hr-fill{transform:scaleX(var(--p,0));transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.hr-splash{transition:opacity .8s ease .3s}
.hr-content{transition:opacity .6s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.hr-exit{opacity:0}.hr-exit .hr-content{opacity:0;transform:scale(1.03)}
.hr-static *{animation:none!important}
@media (prefers-reduced-motion:reduce){.hr-anim *{animation:none!important}}</style><defs>
<filter id="gg-b1" filterUnits="userSpaceOnUse" x="38" y="42" width="44" height="32"><feGaussianBlur stdDeviation="1.7"></feGaussianBlur></filter>
<filter id="gg-b2" filterUnits="userSpaceOnUse" x="20" y="24" width="80" height="68"><feGaussianBlur stdDeviation="6.5"></feGaussianBlur></filter>
<radialGradient id="gg-amb" cx=".5" cy=".5" r=".5"><stop offset="0" class="sc-acc2" stop-opacity=".9"></stop><stop offset=".45" class="sc-acc" stop-opacity=".32"></stop><stop offset="1" class="sc-acc" stop-opacity="0"></stop></radialGradient>
<radialGradient id="gg-rim" gradientUnits="userSpaceOnUse" cx="60" cy="58" r="40"><stop offset="0" class="sc-acc2"></stop><stop offset=".55" class="sc-acc" stop-opacity=".55"></stop><stop offset="1" class="sc-acc" stop-opacity="0"></stop></radialGradient>
<linearGradient id="gg-pl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" class="sc-acc" stop-opacity="0"></stop><stop offset="1" class="sc-acc2" stop-opacity=".8"></stop></linearGradient>
<linearGradient id="gg-pr" x1="1" y1="0" x2="0" y2="0"><stop offset="0" class="sc-acc" stop-opacity="0"></stop><stop offset="1" class="sc-acc2" stop-opacity=".8"></stop></linearGradient>
<linearGradient id="gg-gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"></stop><stop offset=".5" stop-color="#fff" stop-opacity=".38"></stop><stop offset="1" stop-color="#fff" stop-opacity="0"></stop></linearGradient>
<clipPath id="gg-glass"><path d="M39.5 92V40C39.5 23 48.5 13.5 60 13.5C71.5 13.5 80.5 23 80.5 40V92Z"></path></clipPath></defs><g opacity="1"><g class="gl-amb"><g class="gl-br"><ellipse cx="60" cy="57" rx="29" ry="41" fill="url(#gg-amb)"></ellipse></g></g></g><g class="gl-lit"><rect x="45" y="33" width="7" height="46" rx="2" fill="url(#gg-pl)"></rect><rect x="68" y="33" width="7" height="46" rx="2" fill="url(#gg-pr)"></rect></g><g class="gl-plate"><rect class="s-ink f-none" x="45" y="33" width="7" height="46" rx="2" stroke-width="2.6"></rect><rect class="s-ink f-none" x="68" y="33" width="7" height="46" rx="2" stroke-width="2.6"></rect></g><g opacity=".85"><g class="gl-b2"><g class="gl-br"><path d="M50 58H70" stroke="var(--hot)" style="stroke:var(--hot)" stroke-width="13" stroke-linecap="round" fill="none" filter="url(#gg-b2)"></path></g></g></g><g class="gl-fl"><g class="gl-b1"><path d="M51 58H69" style="stroke:var(--hot)" stroke-width="5.5" stroke-linecap="round" fill="none" filter="url(#gg-b1)"></path></g><path class="gl-coil" pathLength="1" d="M60 54.5L63.2 61.5L66.4 54.5L68 58" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path><path class="gl-coil" pathLength="1" d="M60 54.5L56.8 61.5L53.6 54.5L52 58" fill="none" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path></g><g class="gl-sil"><path class="s-ink f-none" d="M38 92V40C38 22 47.5 12 60 12C72.5 12 82 22 82 40V92" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path><path class="s-ink f-none" d="M56.5 12.3V8.6Q60 5.2 63.5 8.6V12.3" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path><path class="s-ink f-none" opacity=".32" d="M43.5 44C43.5 30 48.5 21.5 56 18.5" stroke-width="2.2" stroke-linecap="round"></path></g><g opacity="1"><g class="gl-lit"><g class="gl-br"><path d="M38 92V40C38 22 47.5 12 60 12C72.5 12 82 22 82 40V92" fill="none" stroke="url(#gg-rim)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"></path></g></g></g><g clip-path="url(#gg-glass)"><g transform="rotate(18 60 50)"><rect class="gl-glint" x="44" y="-10" width="16" height="130" fill="url(#gg-gl)"></rect></g></g><g class="gl-sil2"><rect class="f-ink" x="33" y="91" width="54" height="12" rx="3.2"></rect><line class="s-ink" opacity=".55" x1="47" y1="104" x2="47" y2="111.5" stroke-width="2.6" stroke-linecap="round"></line><line class="s-ink" opacity=".55" x1="60" y1="104" x2="60" y2="111.5" stroke-width="2.6" stroke-linecap="round"></line><line class="s-ink" opacity=".55" x1="73" y1="104" x2="73" y2="111.5" stroke-width="2.6" stroke-linecap="round"></line></g></svg>
