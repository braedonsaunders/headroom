<script>
/* Boot splash: the Glow intro plays, the tube breathes while the engine comes up, then it fades into the app.
   It stays at least until the intro has landed (MIN) and never longer than MAX. Click to skip.
   Not shown in a DAW (RIG_HOSTED) or for native screenshots (RIG_NO_SPLASH). */
(() => {
  const th = localStorage.getItem("rig.theme");   // "system" follows macOS (Settings → Appearance)
  if (th === "light" || (th === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches)) document.body.classList.add("light");
  const el = document.getElementById("hr-splash");
  const noop = { progress() {}, ready() {} };
  if (!el || window.RIG_HOSTED || window.RIG_NO_SPLASH) { if (el) el.remove(); window.HRSplash = noop; return; }
  const svg = el.querySelector("svg"), status = svg.querySelector(".hrb-hr-status");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MIN = reduce ? 500 : 3400, MAX = 12000, t0 = performance.now();
  let isReady = false, gone = false;
  svg.classList.add("hrb-hr-driven");
  const progress = (p, msg) => { if (gone) return; svg.style.setProperty("--p", p); if (msg) status.textContent = msg; };
  const leave = () => {
    if (gone) return;
    progress(1, "Ready");
    gone = true;
    setTimeout(() => { svg.classList.add("hrb-hr-exit"); el.classList.add("out"); setTimeout(() => el.remove(), 1400); }, 420);
  };
  const ready = () => { if (isReady) return; isReady = true; setTimeout(leave, Math.max(0, MIN - (performance.now() - t0))); };
  el.addEventListener("click", leave);
  setTimeout(leave, MAX);
  progress(0.16, "Starting audio engine…");
  window.HRSplash = { progress, ready };
})();
</script>

<script>
"use strict";
/* =====================================================================
   PRODUCT IDENTITY — the product name lives here and only here.
   ===================================================================== */
const PRODUCT_NAME = "Headroom";

/* =====================================================================
   STATE
   ===================================================================== */
let API_BASE = "http://127.0.0.1:17770";
let rackState = { preset_idx: -1, presets: [], slots: [], macros: [] };
const ui = {
  theme: localStorage.getItem("rig.theme") || "dark",
  showBypassed: localStorage.getItem("rig.showBypassed") !== "0",
  tag: "all",
  search: "",
  selected: null,
  keepVisible: new Set(),
  expanded: new Set(),
  structureKey: null,
  macroKey: null,
  connected: false,
  everConnected: false,
  pendingPreset: null,
  loadingPreset: null,   // { idx, name } while the engine builds a rig the user picked (loadPresetIdx)
  masterBypass: false,
  playing: false,
  lastScrollT: 0,
};
const snapshot = new Map();          // preset value per param (for reset)
let ctlIndex = new Map();            // "slot:pid" -> [elements]
let vuEls = [];
let drag = null;

/* =====================================================================
   UTILITIES
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hashStr = (s) => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const isIntish = (x) => Math.abs(x - Math.round(x)) < 1e-4;
function polar(cx, cy, r, deg) { const a = (deg - 90) * Math.PI / 180; return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
const f2 = (n) => n.toFixed(2);

/* =====================================================================
   PARAMETER MODEL
   ===================================================================== */
const HIDDEN_PARAM = /meter$|^lamp$|^led$/i;
function visibleParams(slot) {
  return (slot.params || []).filter((p) => !HIDDEN_PARAM.test(String(p.name || "").trim()) && !/meter/i.test(p.id || ""));
}
function paramKind(p) {
  if (p.kind === "bool") return "switch";
  if (p.kind === "stepped") return "step";
  if (p.kind === "continuous") return "cont";
  if (p.fmt === "ON" || p.fmt === "OFF") return "switch";
  const range = p.max - p.min;
  if (!p.unit && range >= 2 && range <= 40 && isIntish(p.min) && isIntish(p.max) && isIntish(p.val)) return "step";
  return "cont";
}
/* A two-position switch as the unit's DSP reads it. The engine sends `on` with every switch parameter: catalogue
   switches rest at the midpoint (raw 0.5, "untouched"), which circuit units and most effects read as off (> 0.5) and
   the behavioural amps / drive pedals and the cabinet rooms' mic switches as on (>= 0.5), so the norm alone cannot
   say. A local move to 0 or 1 sets `on` too (every unit agrees away from the midpoint) until the engine's next sync. */
function switchOn(p) {
  if (!p) return false;
  return typeof p.on === "boolean" ? p.on : p.norm > 0.5;
}
const stepCount = (p) => (Array.isArray(p.labels) && p.labels.length > 1) ? p.labels.length : Math.max(2, Math.round(p.max - p.min) + 1);
const stepIndex = (p, n = p.norm) => Math.round(n * (stepCount(p) - 1));
const stepLabel = (p, i) => (Array.isArray(p.labels) && p.labels[i] != null) ? String(p.labels[i]) : String(Math.round(p.min) + i);
const hasLabels = (p) => Array.isArray(p.labels) && p.labels.length > 1;
/* Face vs. "more" split: the engine ranks params and says how many belong on the compact face. */

    return;
  }
  if (!engineLacks(d)) { toast(d.error ? `Couldn’t rename: ${d.error}` : "Couldn’t rename the rig."); renderRigs(); return; }
  // Fallback: save a copy under the new name, then delete the original.
  if (!await withRigLoaded(idx, "Renaming")) { renderRigs(); return; }
  const oldName = p.name, author = p.author || rackState.author || "";
  if (await doSave(name, author, { quiet: true })) {
    const old = userRigs().find((q) => q.name === oldName && q.name.toLowerCase() !== name.toLowerCase());
    if (old) { try { await fetchJSON(`/api/preset/delete?idx=${old.idx}`); } catch (e) { /* ignore */ } }
    rigsUI.flashName = name;
    await fetchLibrary();
    toast(`Renamed to “${name}”`);
  }
}

// Every group starts collapsed each launch (open/close is remembered only for the session).
const comps = { list: [], categories: [], supported: false, closed: new Set(), closedInit: false, search: "", byTid: new Map() };
// Group order: amps first, then the rest of the catalog, with MIDI & Instruments and Plugins at the end.
function orderedCategories(cats) {
  const tail = ["MIDI & Instruments", "Plugins"];
  const rest = cats.filter((c) => c !== "Amps" && !tail.includes(c));
  return [...(cats.includes("Amps") ? ["Amps"] : []), ...rest, ...tail.filter((c) => cats.includes(c))];
}
function initClosedGroups() {
  if (comps.closedInit || !comps.categories.length) return;
  comps.closedInit = true;
  comps.closed = new Set([...comps.categories, "Plugins"]);
}
async function fetchComponents() {
  try {
    const d = await fetchJSON("/api/components");
    if (d && Array.isArray(d.components)) {
      comps.supported = true;
      fetchComponents.retry = 0;
      comps.list = d.components;
      comps.categories = Array.isArray(d.categories) && d.categories.length ? d.categories : [...new Set(d.components.map((c) => c.category))];
      addSplitComponent();
      initClosedGroups();
      comps.byTid = new Map(comps.list.map((c) => [c.table_id, c]));
      if (window.ComponentDetail) ComponentDetail.injectUserComponents(); // "My Components" (byTid keeps the stock units)
      renderComponents();
      return;
    }
  } catch (e) { /* fall back */ }
  comps.supported = false;
  buildFallbackComponents();
  renderComponents();
  // The engine can still be starting (or busy) when the page first asks: the fallback is only a short stand-in
  // list, so keep retrying until the full catalog arrives instead of leaving the pane half empty.
  fetchComponents.retry = (fetchComponents.retry || 0) + 1;
  if (fetchComponents.retry <= 40) setTimeout(fetchComponents, Math.min(5000, 400 * fetchComponents.retry));
}
function addSplitComponent() {
  if (comps.list.some((c) => c.table_id === "split")) return;
  const cat = comps.categories.includes("Utility") ? "Utility" : (comps.categories.includes("MIDI & Instruments") ? "MIDI & Instruments" : comps.categories[comps.categories.length - 1]);
  comps.list.unshift({ table_id: "split", ref: "Parallel Split", name: "Two lanes side by side", category: cat, archetype: "split", params: [] });
}
function buildFallbackComponents() {
  comps.list = COMP_FALLBACK.map(([tid, ref, arch, cat]) => {
    const seen = seenSlots.get(tid);
    return { table_id: tid, ref: seen ? seen.reference_name : ref, name: seen ? seen.display_name : ref, archetype: seen ? seen.archetype : arch, category: cat,
      engine: seen ? seen.engine || "" : "", params: seen ? seen.params : [], primary: seen ? seen.primary : undefined, factory_presets: [] };
  });
  comps.categories = [...new Set(comps.list.map((c) => c.category))];
  comps.byTid = new Map(comps.list.map((c) => [c.table_id, c]));
}
function onCompSearch(v) { comps.search = v; renderComponents(); }
function compSlot(c) {
  const src = (c.params && c.params.length) ? c.params : ((seenSlots.get(c.table_id) || {}).params || []);
  const params = src.map((p) => {
    const n = typeof p.default === "number" ? p.default : (typeof p.norm === "number" ? p.norm : 0.5);
    return { ...p, norm: n, val: p.min + n * (p.max - p.min) };
  });
  return { slot_idx: -1, table_id: c.table_id, reference_name: c.ref || c.name, display_name: c.name || c.ref, archetype: c.archetype || "",
    bypassed: false, params, primary: c.primary, engine: c.engine || "" };
}

// A preview (component detail hero, drag ghost, room pickers) wraps the unit the way the chain places it: an
// illustrated face by its own drawing (layoutDesc), not by the name-based guess. A drawn combo or rack face is
// sized by its wrapper, so handed out bare (e.g. "Vox AC30 Top Boost" reads as a booster) it collapses to 0×0.
function unitPreviewHTML(s) {

  if (d.form === "nam") return `<div class="stack" style="width:860px">${namHTML(s, 0)}</div>`;
  if (d.form === "midi") return `<div style="width:${d.kind === "detector" || d.kind === "midifx" ? 560 : 760}px">${midiUnitHTML(s, 0)}</div>`;
  if (d.form === "pedal" || d.form === "wah") return pedalHTML(s, d, 0);
  if (d.form === "amp") return `<div class="stack" style="width:860px">${ampHTML(s, { ...d, _name: s.reference_name }, 0)}</div>`;
  if (d.form === "cab") return `<div class="stack" style="width:860px">${cabHTML(s, d, 0, null)}</div>`;
  return `<div class="rack" style="width:900px"><div class="rack-rail l"></div><div class="rack-rail r"></div><div class="rack-units">${rackHTML(s, d, 0)}</div></div>`;
}

  $("comp-count").textContent = comps.list.length ? `${comps.list.length} units` : "";

  let shown = [];

    const t = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    shown = [];

    list.innerHTML = shown.length ? shown.map((i, j) => {

  const pn = (id, def = 0.5) => { const p = P(s, id); return p ? p.norm : def; };
  document.querySelectorAll(`#rack-bay [data-unit="${idx}"] .sdisp[data-sd], #sheet-body [data-unit="${idx}"] .sdisp[data-sd], #view-room [data-unit="${idx}"] .sdisp[data-sd]`).forEach((el) => {
    const t = el.dataset.sd;
    let inner = "";
    const grid = `<line x1="0" y1="30" x2="120" y2="30"/><line x1="40" y1="0" x2="40" y2="60"/><line x1="80" y1="0" x2="80" y2="60"/>`;
    if (t.startsWith("env:")) {
      const pre = t.slice(4);
      const a = pn(`${pre}_a`, 0.1), d = pn(`${pre}_d`, 0.3), su = pn(`${pre}_s`, 0.6), r = pn(`${pre}_r`, 0.3);
      const wa = 4 + a * 30, wd = 4 + d * 30, wr = 4 + r * 30, ws = Math.max(8, 112 - wa - wd - wr);
      const y = (v) => 54 - v * 46, x1 = 4 + wa, x2 = x1 + wd, x3 = x2 + ws, x4 = x3 + wr;
      const path = `M4 54 C${4 + wa * 0.35} ${y(0.75)} ${x1 - wa * 0.15} ${y(1)} ${x1} ${y(1)} C${x1 + wd * 0.35} ${y(su)} ${x2 - wd * 0.4} ${y(su)} ${x2} ${y(su)} L${x3} ${y(su)} C${x3 + wr * 0.3} ${y(su * 0.25)} ${x4 - wr * 0.3} 54 ${x4} 54`;
      inner = `${grid}<path class="f" d="${path} Z"/><path class="l" d="${path}"/>`;
    } else if (t === "filter") {
      const fc = pn("cutoff", 0.6), q = P(s, "res") ? pn("res") : pn("resonance", 0.3);
      let path = "";
      for (let i = 0; i <= 60; i++) { const x = i / 60, o = (x - fc) * 6, db = (o > 0 ? -o * 15 : 0) + q * 18 * Math.exp(-o * o * 3); path += `${i ? "L" : "M"}${(x * 120).toFixed(1)} ${Math.max(2, Math.min(58, 26 - db * 1.1)).toFixed(1)} `; }
      inner = `${grid}<path class="f" d="${path} L120 60 L0 60 Z"/><path class="l" d="${path}"/>`;
    } else if (t === "lfo") {
      const rate = pn("lfo_rate", 0.3), amt = P(s, "lfo_amt") ? pn("lfo_amt") : Math.max(pn("lfo_pitch", 0), pn("lfo_cutoff", 0), 0.15);
      const cyc = 1 + Math.round(rate * 5), A = 6 + amt * 20;
      let path = "";
      for (let i = 0; i <= 160; i++) { const x = i / 160; path += `${i ? "L" : "M"}${(x * 120).toFixed(1)} ${(30 - Math.sin(x * cyc * Math.PI * 2) * A).toFixed(1)} `; }
      inner = `${grid}<path class="l" d="${path}"/>`;
    }
    const html = `<svg viewBox="0 0 120 60" preserveAspectRatio="none">${inner}</svg>`;
    if (el._sig !== html) { el._sig = html; el.innerHTML = html; }
  });
}

/* ---------- pianos + live notes (telemetry.midi; no rebuilds) ---------- */
function pianoHTML() {
  const lo = 24, hi = 108, isBlack = (n) => [1, 3, 6, 8, 10].includes(n % 12);
  const whites = range(lo, hi).filter((n) => !isBlack(n)), w = 100 / whites.length;
  let wk = "", bk = "";
  whites.forEach((n, i) => {
    wk += `<span class="wk${n % 12 === 0 ? " c" : ""}" data-n="${n}"${n % 12 === 0 ? ` data-o="C${n / 12 - 1}"` : ""}></span>`;
    if (n < hi && isBlack(n + 1)) bk += `<span class="bk" data-n="${n + 1}" style="left:${((i + 1) * w).toFixed(3)}%"></span>`;
  });
  return `${wk}<div class="bk-layer" style="--bw:${(w * 0.62).toFixed(3)}%">${bk}</div>`;
}
const live = { pianos: [], last: null };
/* Which Pitch → MIDI unit feeds each slot: the nearest detector upstream in the same signal path. */
function feedMap() {
  const map = {};
  const walk = (items, det) => {
    items.forEach((it) => {
      if (it.type === "unit") { const s = getSlot(it.slot); if (s && midiKind(s) === "detector") det = it.slot; map[it.slot] = det; }
      else if (it.type === "split") (it.lanes || []).forEach((l) => walk(l, det));
    });
  };
  walk(rackLayout(), null);
  return map;
}
function indexPianos() {
  const fm = feedMap();
  live.pianos = [...document.querySelectorAll("#rack-bay .piano, #sheet-body .piano, #view-room .piano")].map((el) => {   // + the Room's keyboards
    const keys = new Map();
    el.querySelectorAll("[data-n]").forEach((k) => keys.set(+k.dataset.n, k));
    const unit = el.closest(".unit");
    const own = el.dataset.feed !== undefined && el.dataset.feed !== "" ? +el.dataset.feed : null;
    return { el, keys, unit, slot: el.dataset.range !== "" ? +el.dataset.range : null, feed: own != null ? fm[own] ?? null : null, key: null };
  });
  paintRanges();
  if (live.last) onMidiTelemetry(live.last);
}
function paintRanges() {
  live.pianos.forEach((pi) => {
    if (pi.slot == null) return;
    const s = getSlot(pi.slot);
    if (!s) return;
    const lo = P(s, "low"), hi = P(s, "high");
    const ln = lo && hasLabels(lo) ? labelToNote(stepLabel(lo, stepIndex(lo))) : null, hn = hi && hasLabels(hi) ? labelToNote(stepLabel(hi, stepIndex(hi))) : null;
    pi.keys.forEach((el, n) => { const out = (ln != null && n < ln) || (hn != null && n > hn); if (el._out !== out) { el._out = out; el.classList.toggle("out", out); } });
  });
}
function labelToNote(l) {
  const m = String(l).match(/^([A-G])([#♯b♭]?)(-?\d+)$/);
  if (!m) return null;
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === "#" || m[2] === "♯" ? 1 : m[2] ? -1 : 0);
  return (+m[3] + 1) * 12 + base;
}
const noteList = (notes) => (notes || []).map((x) => (Array.isArray(x) ? x[0] : x.note)).filter((n) => typeof n === "number").sort((a, b) => a - b);
function unitMidi(t, slot) {
  const u = t.units && slot != null ? (t.units[slot] || t.units[String(slot)]) : null;
  if (u) return u;
  if (t.units && Object.keys(t.units).length) return { notes: [], pitch: 0, confidence: 0 };
  return t;
}
function paintPiano(pi, ns) {
  const off = pi.unit && pi.unit.classList.contains("bypassed");
  const key = off ? "" : ns.join(",");
  if (key === pi.key) return;
  const prev = new Set((pi.key || "").split(",").filter(Boolean).map(Number)), now = new Set(off ? [] : ns);
  pi.key = key;
  prev.forEach((n) => { if (!now.has(n)) { const k = pi.keys.get(n); if (k) k.classList.remove("on"); } });
  now.forEach((n) => { if (!prev.has(n)) { const k = pi.keys.get(n); if (k) k.classList.add("on"); } });
}
function onMidiTelemetry(t) {
  if (!t) return;
  live.last = t;
  paintBloom(t);
  if (!live.pianos.length) return;
  live.pianos.forEach((pi) => paintPiano(pi, noteList(unitMidi(t, pi.feed).notes)));
  document.querySelectorAll("#rack-bay .note-disp[data-det], #sheet-body .note-disp[data-det]").forEach((nd) => {
    const m = unitMidi(t, +nd.dataset.det), ns = noteList(m.notes);
    const pitch = typeof m.pitch === "number" && m.pitch > 0 ? m.pitch : 0;
    const nn = pitch ? 69 + 12 * Math.log2(pitch / 440) : 0, r = Math.round(nn), cents = Math.round((nn - r) * 100);
    setText(nd.querySelector(".nd-note"), pitch ? noteName(r) : (ns.length ? noteName(ns[0]) : "—"));
    setText(nd.querySelector(".nd-hz"), pitch ? `${pitch.toFixed(1)} Hz ${cents >= 0 ? "+" : "−"}${Math.abs(cents)}¢` : "");
    setText(nd.querySelector(".nd-chord"), ns.length > 1 ? ns.map(noteName).join(" ") : "");
    setStyle(nd.querySelector(".nd-cb"), "width", `${Math.round(clamp01(m.confidence || 0) * 100)}%`);
  });
}

/* =====================================================================
   EDIT SHEET — full faceplate for units shown compactly in lanes
   ===================================================================== */
function fullUnitHTML(s) {
  const prev = RENDER.compact;
  RENDER.compact = false;
  const d = describe(s);
  let h;
  if (d.form === "midi") h = midiUnitHTML(s, 0);
  else if (d.form === "nam") h = `<div class="stack">${namHTML(s, 0)}</div>`;
  else if (d.form === "pedal" || d.form === "wah") h = `<div class="board sheet-board"><div class="board-row">${pedalHTML(s, d, 0)}</div></div>`;
  else if (d.form === "amp") h = `<div class="stack">${ampHTML(s, { ...d, _name: s.reference_name }, 0)}</div>`;
  else if (d.form === "cab") h = `<div class="stack">${cabHTML(s, d, 0, null)}</div>`;
  else h = `<div class="rack"><div class="rack-rail l"></div><div class="rack-rail r"></div><div class="rack-units">${rackHTML(s, d, 0)}</div></div>`;
  RENDER.compact = prev;
  return h;
}
function openSheet(idx) {
  if (!getSlot(idx)) return;
  ui.sheetSlot = idx;
  $("sheet-back").hidden = false;
  renderSheet();
  selectUnit(idx, false);
}
function closeSheet() {
  if (ui.sheetSlot == null) return;
  ui.sheetSlot = null;
  $("sheet-back").hidden = true;
  $("sheet-body").innerHTML = "";
  indexControls();
  indexPianos();
}
function renderSheetHdr() {
  const s = getSlot(ui.sheetSlot);
  if (!s) return;
  const d = describe(s);
  const lane = (() => { let r = ""; const walk = (items, tag) => items.forEach((it) => { if (it.type === "unit" && it.slot === s.slot_idx) r = tag; else if (it.type === "split") (it.lanes || []).forEach((l, li) => walk(l, `Lane ${li ? "B" : "A"}`)); }); walk(rackLayout(), "Main chain"); return r; })();
  const pl = (s.factory_presets || []).length ? presetLabel(s) : null;
  $("sheet-hdr").innerHTML = `<div class="sh-titles"><div class="sh-name">${esc(unitTitle(s))}</div><div class="sh-sub">${esc(s.display_name)} · ${esc(FORM_LABEL[layoutDesc(s).form] || "")}${lane ? ` · ${lane}` : ""}${pl ? ` · Preset: ${esc(pl.name)}${pl.mod ? " (edited)" : ""}` : ""}</div></div>
    <span class="su-sp"></span>
    <button class="text-btn" data-sheet="bypass">${PWR_SVG}${s.bypassed ? "Enable" : "Bypass"}</button>
    <button class="icon-btn" data-sheet="close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>`;
}
function renderSheet() {
  const s = getSlot(ui.sheetSlot);
  if (!s) { closeSheet(); return; }
  renderSheetHdr();
  const body = $("sheet-body");
  const st = body.scrollTop;
  body.innerHTML = `<div class="sheet-unit">${fullUnitHTML(s)}</div>`;
  body.scrollTop = st;
  indexControls();
  indexPianos();
  refreshSynDisplays(s.slot_idx);
  refreshDisplays(s.slot_idx);
}

/* =====================================================================
   SPLIT MIX ON MACROS
   ===================================================================== */
async function assignSplitMacro(col, id, add) {
  const d = await rackCall(`/api/macro/assign?col=${col}&split=${id}&min=0&max=1${add ? "" : "&label=Blend"}&add=${add ? 1 : 0}`, "Assigning a split to a macro needs the updated engine.");
  if (d) { markDirty(); toast(`Split A↔B mix ${add ? "added to" : "assigned to"} Macro ${col + 1}`); }
}
function splitCtlMenu(x, y, el) {
  const id = +String(el.dataset.slot).slice(1);
  const ms = rackState.macros || [];
  const items = [{ h: "Parallel Split · A↔B Mix" }];
  if (ms.length) {
    items.push({ h: "Assign to macro" });
    ms.forEach((m, c) => {
      const { empty, targets } = macroInfo(m);
      const here = targets.some((t) => t.split === id);
      items.push({ k: String(c + 1), label: empty ? "Empty" : m.name, sub: here ? "✓ linked" : (empty ? "" : macroTargetText(m)), onClick: () => assignSplitMacro(c, id, false), row: !empty && !here, xLabel: "+ Add", onX: () => assignSplitMacro(c, id, true) });
    });
    items.push({ sep: true });
  }
  items.push({ label: "Reset to 50 / 50", onClick: () => resetValue(el) });
  showMenu(x, y, items);
}

async function loadCatalogs() {
  if (!ui.catalogsLoaded) {
    ui.catalogsLoaded = true;
    fetchComponents();
    fetchTracks();
    fetchJSON("/api/audio").then((a) => { if (a && a.current) { audioCfg = a; paintSource(a.current.source); } }).catch(() => {});
  }
  loadLibrary();
}
async function loadLibrary() {
  clearTimeout(ui.libTimer);
  const ok = await fetchLibrary();
  if (!ok && (lib.indexing || ui.libRetry < 3) && ui.libRetry < 40) { ui.libRetry++; ui.libTimer = setTimeout(loadLibrary, 1000); }
  // the engine indexes the library for a few seconds after launch
}
$("brand-name").textContent = PRODUCT_NAME;
document.title = PRODUCT_NAME;
ui.libRetry = 0;
applyTheme();
loadPanes();
wire();
setLeftTab(localStorage.getItem("rig.leftTab") || "library");
renderChain(false);
renderInspector();
renderPresetList(false);
drawScope([], []);
fetchRackState().then((ok) => { window.HRSplash?.progress(ok ? 0.86 : 1, ok ? "Scanning presets…" : "Engine offline"); }).finally(() => {
  loadCatalogs(); setTimeout(pollTelemetry, 80); window.HRSplash?.ready();
});
